<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eagle to Obsidian</title>
    <style>
        :root {
            color-scheme: normal;
            --panel-bg: transparent;
            --surface-bg: rgba(255, 255, 255, 0.055);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.12);
            --border: rgba(255, 255, 255, 0.13);
            --text-primary: #eeeeF2;
            --text-secondary: #a6a6b1;
            --accent: #b4a0ec;
            --accent-bg: #7655bd;
            --focus-ring: rgba(180, 160, 236, 0.22);
        }

        * { box-sizing: border-box; }

        html {
            min-height: 100%;
            background: transparent;
            font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            margin: 0;
            color: var(--text-primary);
            background: var(--panel-bg);
        }

        button, input { font: inherit; }
        button { cursor: pointer; -webkit-app-region: no-drag; }
        button, input { -webkit-tap-highlight-color: transparent; }

        .plugin-shell { padding: 10px 12px 12px; }

        .toolbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 26px;
            margin-bottom: 8px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0;
            font-size: 12px;
            font-weight: 600;
        }

        .section-title svg { width: 14px; height: 14px; color: var(--text-secondary); }

        .buttons-row { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }

        .buttons-row:empty::before {
            content: "No links yet";
            display: block;
            padding: 4px 0;
            color: var(--text-secondary);
        }

        .url-btn {
            display: block;
            min-width: 0;
            max-width: 100%;
            height: 32px;
            padding: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface-bg);
            color: var(--text-primary);
            text-align: left;
            transition: background-color 120ms ease, border-color 120ms ease;
        }

        .url-btn:hover { background: var(--surface-hover); border-color: var(--text-secondary); }
        .url-btn:active { background: var(--input-bg); }

        .add-btn {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            padding: 5px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: transparent;
            color: var(--text-secondary);
        }

        .add-btn svg { width: 16px; height: 16px; }
        .add-btn:hover { background: var(--surface-hover); color: var(--text-primary); }

        .form-card {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .form-title { margin: 0 0 12px; font-size: 12px; font-weight: 600; }
        .form-field { margin-bottom: 12px; }
        .inlineFormLabel { display: block; margin-bottom: 5px; color: var(--text-secondary); font-size: 11px; }

        .form-input {
            display: block;
            width: 100%;
            min-width: 0;
            height: 32px;
            padding: 6px 9px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--text-primary);
            outline: none;
        }

        .form-input::placeholder { color: var(--text-secondary); opacity: 0.65; }
        .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--focus-ring); }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .form-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 2px; }
        .action-btn {
            min-height: 30px;
            padding: 5px 13px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--surface-bg);
            color: var(--text-primary);
            font-weight: 500;
        }

        .cancel-btn:hover { background: var(--surface-hover); }
        .confirm-btn { border-color: var(--accent-bg); background: var(--accent-bg); color: #fff; }
        .confirm-btn:hover { filter: brightness(1.12); }

        .svg-icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 16px;
            margin-right: 7px;
            vertical-align: -3px;
        }

        .svg-icon-wrapper svg { display: block; width: 14px; height: 16px; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }

        :root[data-theme="LIGHT"], :root[data-theme="LIGHTGRAY"] {
            --surface-bg: rgba(0, 0, 0, 0.025);
            --surface-hover: rgba(0, 0, 0, 0.06);
            --input-bg: rgba(255, 255, 255, 0.65);
            --border: rgba(0, 0, 0, 0.12);
            --text-primary: #303038;
            --text-secondary: #6c6c76;
            --accent: #7655bd;
            --focus-ring: rgba(118, 85, 189, 0.14);
        }

        @media (prefers-reduced-motion: reduce) {
            .url-btn { transition: none; }
        }
    </style>
</head>

<body>
    <main class="plugin-shell">
        <div class="toolbar-row">
            <h1 class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2"/>
                    <path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/>
                </svg>
                Links
            </h1>
            <button id="registerUrlBtn" class="add-btn" type="button" aria-label="Add link" title="Add link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </button>
        </div>
        <div id="urlButtonsContainer" class="buttons-row" role="group" aria-label="Linked destinations"></div>

        <div id="urlInlineForm" class="form-card" role="group" aria-labelledby="inlineFormTitle">
            <h2 class="form-title" id="inlineFormTitle">Register Link</h2>
            <div class="form-field">
                <label class="inlineFormLabel" for="inlineUrlNameInput">Name</label>
                <input type="text" id="inlineUrlNameInput" class="form-input" placeholder="Link name" autocomplete="off">
            </div>
            <div class="form-field">
                <label class="inlineFormLabel" for="inlineUrlAddressInput">URL address</label>
                <input type="text" id="inlineUrlAddressInput" class="form-input" placeholder="obsidian://… or https://…" autocomplete="off" spellcheck="false">
            </div>
            <div class="form-actions">
                <button id="inlineFormCancelBtn" class="action-btn cancel-btn" type="button">Cancel</button>
                <button id="inlineFormConfirmBtn" class="action-btn confirm-btn" type="button">Confirm</button>
            </div>
        </div>
    </main>

    <script>
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
    let eagleTheme = 'AUTO';
    function applyTheme(theme) {
        eagleTheme = String(theme || 'AUTO').toUpperCase();
        document.documentElement.dataset.theme = eagleTheme === 'AUTO'
            ? (systemTheme.matches ? 'DARK' : 'LIGHT') : eagleTheme;
    }
    systemTheme.addEventListener('change', () => applyTheme(eagleTheme));
    eagle.onThemeChanged(applyTheme);
    applyTheme(eagle.app.theme);

    const fs = require('fs');
    const path = require('path');
    const OBSIDIAN_METADATA_KEY = 'Obsidian';
    const LEGACY_METADATA_KEY = 'SynchLink';
    const DEFAULT_LINK_NAME = 'Obsidian';

    let currentItem = null;
    let urlList = [];
    let editingIndex = null;
    let metadataFilePath = null;

    const registerUrlBtn = document.getElementById('registerUrlBtn');
    const urlButtonsContainer = document.getElementById('urlButtonsContainer');
    const urlInlineForm = document.getElementById('urlInlineForm');
    const inlineFormTitle = document.getElementById('inlineFormTitle');
    const inlineUrlNameInput = document.getElementById('inlineUrlNameInput');
    const inlineUrlAddressInput = document.getElementById('inlineUrlAddressInput');
    const inlineFormCancelBtn = document.getElementById('inlineFormCancelBtn');
    const inlineFormConfirmBtn = document.getElementById('inlineFormConfirmBtn');

    function normalizeEntry(entry) {
        if (!entry || typeof entry.url !== 'string') {
            return null;
        }

        return {
            name: entry.name || DEFAULT_LINK_NAME,
            url: entry.url
        };
    }

    function showInlineForm(title, name = DEFAULT_LINK_NAME, url = '') {
        inlineFormTitle.textContent = title;
        inlineUrlNameInput.value = name;
        inlineUrlAddressInput.value = url;
        urlInlineForm.style.display = 'block';
        inlineUrlNameInput.focus();
    }

    function hideInlineForm() {
        urlInlineForm.style.display = 'none';
    }

    function getIconHtml(entry) {
        if (entry.url && entry.url.startsWith('obsidian://')) {
            const iconPath = path.join(__dirname, 'Obsidian.svg');
            const svgContent = fs.readFileSync(iconPath, 'utf8');
            return `<span class="svg-icon-wrapper">${svgContent}</span>`;
        }

        if (entry.url && entry.url.startsWith('zotero://')) {
            const iconPath = path.join(__dirname, 'Zotero.svg');
            const svgContent = fs.readFileSync(iconPath, 'utf8');
            return `<span class="svg-icon-wrapper">${svgContent}</span>`;
        }

        return '';
    }

    function renderUrlButtons() {
        urlButtonsContainer.innerHTML = '';
        urlList.forEach((entry, idx) => {
            const btn = document.createElement('button');
            btn.className = 'url-btn';

            const iconHtml = getIconHtml(entry);
            if (iconHtml) {
                btn.innerHTML = `${iconHtml}<span>${entry.name || DEFAULT_LINK_NAME}</span>`;
            } else {
                btn.textContent = entry.name || DEFAULT_LINK_NAME;
            }

            const childProcess = require('child_process');
            btn.onclick = () => {
                if (!entry.url) return;

                if (/^(https?:\/\/)/i.test(entry.url)) {
                    eagle.shell.openExternal(entry.url);
                    return;
                }

                let targetPath = entry.url;
                if (/^file:\/\//i.test(targetPath)) {
                    targetPath = decodeURIComponent(targetPath.replace(/^file:\/\//i, ''));
                }

                console.log('Trying to open path:', targetPath);

                if (fs.existsSync(targetPath) && fs.lstatSync(targetPath).isDirectory()) {
                    eagle.shell.showItemInFolder(targetPath);
                    return;
                }

                if (fs.existsSync(targetPath) && fs.lstatSync(targetPath).isFile()) {
                    try {
                        childProcess.exec(`start "" "${targetPath}"`);
                    } catch (err) {
                        console.error('Failed to open file with child_process:', err);
                    }
                    return;
                }

                eagle.shell.openExternal(entry.url);
            };

            btn.oncontextmenu = (e) => {
                e.preventDefault();
                eagle.contextMenu.open([
                    {
                        id: 'modify',
                        label: 'Modify',
                        click: () => {
                            editingIndex = idx;
                            showInlineForm('Modify Link', entry.name || DEFAULT_LINK_NAME, entry.url);
                        }
                    },
                    {
                        id: 'delete',
                        label: 'Delete',
                        click: async () => {
                            urlList.splice(idx, 1);
                            await saveObsidianLinks();
                            renderUrlButtons();
                        }
                    }
                ]);
            };

            urlButtonsContainer.appendChild(btn);
        });
    }

    async function saveObsidianLinks() {
        if (!metadataFilePath) return;
        try {
            const data = fs.readFileSync(metadataFilePath, 'utf8');
            const json = JSON.parse(data);
            json[OBSIDIAN_METADATA_KEY] = urlList.map(({ name, url }) => ({
                name: name || DEFAULT_LINK_NAME,
                url
            }));
            delete json[LEGACY_METADATA_KEY];
            fs.writeFileSync(metadataFilePath, JSON.stringify(json, null, 2), 'utf8');
        } catch (err) {
            console.error('Failed to save Obsidian links:', err);
        }
    }

    function loadObsidianLinks() {
        urlList = [];
        if (!metadataFilePath) return;

        try {
            const data = fs.readFileSync(metadataFilePath, 'utf8');
            const json = JSON.parse(data);
            const loadedList = Array.isArray(json[OBSIDIAN_METADATA_KEY])
                ? json[OBSIDIAN_METADATA_KEY]
                : Array.isArray(json[LEGACY_METADATA_KEY])
                    ? json[LEGACY_METADATA_KEY]
                    : [];

            urlList = loadedList
                .map(normalizeEntry)
                .filter((entry) => Boolean(entry));
        } catch (err) {
            console.error('Failed to load Obsidian links:', err);
        }
    }

    registerUrlBtn.onclick = () => {
        editingIndex = null;
        showInlineForm('Register Link', DEFAULT_LINK_NAME);
    };

    inlineFormCancelBtn.onclick = () => {
        hideInlineForm();
    };

    inlineFormConfirmBtn.onclick = async () => {
        const name = inlineUrlNameInput.value.trim() || DEFAULT_LINK_NAME;
        const url = inlineUrlAddressInput.value.trim();
        if (!url) return;

        const entry = { name, url };
        if (editingIndex !== null) {
            urlList[editingIndex] = entry;
        } else {
            urlList.push(entry);
        }

        await saveObsidianLinks();
        renderUrlButtons();
        hideInlineForm();
    };

    eagle.onPluginCreate(async () => {
        applyTheme(await eagle.app.theme);
        const items = await eagle.item.getSelected();
        currentItem = items[0];
        metadataFilePath = currentItem?.metadataFilePath;
        loadObsidianLinks();
        renderUrlButtons();
    });
    </script>
</body>
</html>
